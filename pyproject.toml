[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "uzparser"
version = "0.5.0"
description = "uzParser — MCP-сервер для Claude: поиск по OLX.uz, Uzum Market и avtoelon.uz"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
uzparser = "uzparser.server:main"
olx-mcp = "uzparser.server:main"  # старое имя

[tool.setuptools]
packages = ["uzparser", "olx_mcp"]
